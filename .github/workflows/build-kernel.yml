name: Build Orange Pi 4Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h

      - name: Build kernel
        run: |
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=current \
            BUILD_OPT=kernel \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=no 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-orangepi4pro
          path: |
            output/debs/*.deb
            build.log
          retention-days: 7
          if-no-files-found: warn

name: Build Orange Pi 4Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=current \
            BUILD_OPT=kernel \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=no 2>&1 | tee build.log

      - name: Verify PowerVR BXM artifacts
        shell: bash
        run: |
          set -euo pipefail

          config=$(find kernel -type f -name .config -print -quit)
          test -n "${config}"
          grep -Fx 'CONFIG_AW_GPU_TYPE="bxm"' "${config}"
          if grep -Eq '^CONFIG_DRM_(IMAGINATION|POWERVR)=' "${config}"; then
            echo "Open DRM PowerVR and vendor pvrsrvkm must not be enabled together" >&2
            exit 1
          fi

          module=$(find .tmp -type f -name pvrsrvkm.ko -print -quit)
          test -n "${module}"

          image_deb=$(find output/debs -maxdepth 1 -type f \
            -name 'linux-image-current-sun60iw2_*.deb' -print -quit)
          test -n "${image_deb}"
          dpkg-deb --contents "${image_deb}" | grep -F 'pvrsrvkm.ko'

          verification_dir="${RUNNER_TEMP}/gpu-verification"
          mkdir -p "${verification_dir}"
          cp "${config}" "${verification_dir}/kernel.config"
          cp "${module}" "${verification_dir}/pvrsrvkm.ko"
          sha256sum "${image_deb}" "${module}" \
            | tee "${verification_dir}/SHA256SUMS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-orangepi4pro
          path: |
            output/debs/*.deb
            ${{ runner.temp }}/gpu-verification/*
            build.log
          retention-days: 7
          if-no-files-found: error

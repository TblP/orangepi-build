name: Build Orange Pi 4Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel
        run: |
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=current \
            BUILD_TARGET=kernel \
            KERNEL_CONFIGURE=no
        continue-on-error: true

      - name: Show output
        run: |
          find . -name "*.deb" 2>/dev/null
          ls output/debs/ 2>/dev/null || echo "no debs"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-orangepi4pro
          path: output/debs/*.deb
          retention-days: 7
          if-no-files-found: warn
